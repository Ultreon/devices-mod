plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi.configureDataGeneration {
    client = true
    outputDirectory = project(":common").file("src/main/generated")
}

loom {
    mods {
        register("omnixerio_redstone") {
            sourceSet("main")
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    api("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1")

    api "me.shedaniel:RoughlyEnoughItems-fabric:26.2.820"

    include implementation("org.apache.httpcomponents:httpclient:4.5.14")

    common(project(path: ':common')) { transitive false }
    shadowCommon project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    from(jar)

    configurations = [project.configurations.shadowCommon]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = null
    from rootProject.file("LICENSE")
}

tasks.build.dependsOn(shadowJar)